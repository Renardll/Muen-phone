<!doctype html>
<!-- __MUEN_RENDER__ 慕恩悬浮手机前端 v2.0 单文件自包含（无外部依赖） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>慕恩手机</title>
<style>
:root{
  --bg:#0b0b10; --card:#1c1c24; --card2:#23232c; --line:#2e2e38;
  --text:#f2f2f7; --sub:#9b9ba6; --dim:#6b6b76;
  --green:#95ec69; --wechat:#07c160; --blue:#0a84ff; --amber:#ff9f0a;
  --purple:#bf5af2; --pink:#ff375f; --red:#ff453a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px}
#app{position:absolute;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);
  overflow:hidden;animation:fadeIn .18s ease}
.screen.on{display:flex}
@keyframes fadeIn{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ---------- 通用页头 ---------- */
.page-head{display:flex;align-items:center;gap:4px;padding:8px 10px;background:var(--card);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.page-head .back{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--blue);background:transparent;border:none;cursor:pointer}
.page-head .back:active{background:var(--card2)}
.page-head .title{flex:1;text-align:center;font-size:15px;font-weight:600;margin-right:28px}
.page-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.page-body::-webkit-scrollbar{display:none}
/* ---------- 主屏 ---------- */
#screen-home{background:radial-gradient(120% 90% at 20% 10%, #2b2350 0%, #17122e 45%, #0b0b10 100%)}
.home-top{padding:26px 22px 10px;display:flex;flex-direction:column;gap:6px}
.home-date{font-size:13px;color:#c9c4e6}
.home-time{font-size:40px;font-weight:300;letter-spacing:1px;color:#fff}
.home-apps{flex:1;display:grid;grid-template-columns:repeat(2,1fr);align-content:start;gap:30px 20px;padding:14px 22px}
.app-tile{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;border:none;background:none;color:var(--text);font-family:inherit}
.app-tile .icon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:31px;box-shadow:0 4px 14px rgba(0,0,0,.45);transition:transform .12s}
.app-tile:active .icon{transform:scale(.9)}
.app-tile .label{font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.icon-profile{background:linear-gradient(135deg,#4a7dff,#8b5cf6)}
.icon-wechat{background:linear-gradient(135deg,#07c160,#0aa858)}
/* ---------- 档案页 ---------- */
.section{margin:10px 12px;background:var(--card);border-radius:14px;overflow:hidden}
.section-title{display:flex;align-items:center;gap:7px;padding:10px 13px 6px;font-size:12px;font-weight:600;
  color:var(--sub);letter-spacing:1px}
.section-title .dot{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 13px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .k{color:var(--sub);font-size:13px;flex:0 0 auto}
.row .v{font-size:13px;text-align:right;word-break:break-all}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap}
.badge-green{background:rgba(7,193,96,.16);color:#34d97c}
.badge-amber{background:rgba(255,159,10,.16);color:var(--amber)}
.badge-red{background:rgba(255,69,58,.16);color:var(--red)}
.badge-purple{background:rgba(191,90,242,.16);color:var(--purple)}
.badge-blue{background:rgba(10,132,255,.16);color:var(--blue)}
.badge-gray{background:rgba(120,120,140,.18);color:var(--sub)}
.bar{height:7px;border-radius:4px;background:#2a2a34;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:4px;transition:width .5s ease}
.bar .b-aff{background:linear-gradient(90deg,#ff9f0a,#ffd60a)}
.bar .b-dep{background:linear-gradient(90deg,#ff375f,#bf5af2)}
.bar .b-des{background:linear-gradient(90deg,#ff453a,#ff9f0a)}
.bar .b-skill{background:linear-gradient(90deg,#0a84ff,#64d2ff)}
.bar .b-dev{background:linear-gradient(90deg,#bf5af2,#ff2d55)}
.parts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 13px 13px}
.part{background:var(--card2);border-radius:10px;padding:8px 10px}
.part .pn{font-size:13px;font-weight:600;margin-bottom:6px}
.part .pr{font-size:11px;color:var(--sub);margin:4px 0 3px;display:flex;justify-content:space-between}
.text-line{padding:8px 13px;font-size:13px;line-height:1.55;border-top:1px solid var(--line)}
.text-line:first-child{border-top:none}
.text-line.empty{color:var(--dim)}
/* ---------- 世界：自然时间行 + 胶囊 ---------- */
.world-line{padding:10px 13px 4px;font-size:14px;font-weight:600;letter-spacing:.3px}
.capsule-row{display:flex;flex-wrap:wrap;gap:6px;padding:4px 13px 10px}
.capsule{padding:3px 11px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.6}
.cap-priv{background:rgba(255,159,10,.16);color:var(--amber)}
.cap-pub{background:rgba(255,69,58,.16);color:var(--red)}
.cap-indoor{background:rgba(52,199,89,.16);color:#34d97c}
.cap-nsfw{background:rgba(255,69,58,.16);color:var(--red)}
.cap-normal{background:rgba(7,193,96,.16);color:#34d97c}
.cap-other{background:rgba(120,120,140,.18);color:var(--sub)}
/* ---------- 状态：数值卡（无进度条） ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 13px 13px}
.stat-cell{background:var(--card2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.stat-cell .sc-label{font-size:11px;color:var(--sub)}
.stat-cell .sc-val{font-size:24px;font-weight:700;line-height:1.1}
.sc-aff{color:var(--amber)} .sc-dep{color:var(--pink)} .sc-des{color:var(--red)} .sc-exp{color:var(--green)}
.sc-unit{font-size:13px;font-weight:600;color:var(--dim)}
.stat-cell .sc-sub{display:flex;align-items:center;gap:6px}
/* ---------- 身体状态：改造列表 ---------- */
.mod-item{padding:7px 13px;border-top:1px solid var(--line);font-size:13px;display:flex;gap:8px;line-height:1.5}
.mod-item:first-child{border-top:none}
.mod-item .dot{color:var(--purple);flex:0 0 auto}
/* ---------- 微信会话列表 ---------- */
#screen-chatlist{background:var(--bg)}
.chat-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.chat-item:active{background:var(--card2)}
.chat-ava{width:46px;height:46px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#3a3a46,#26262e);font-size:20px;color:var(--sub)}
.chat-main{flex:1;min-width:0}
.chat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.chat-name{font-size:15px;font-weight:500}
.chat-time{font-size:11px;color:var(--dim)}
.chat-preview{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-tip{padding:60px 20px;text-align:center;color:var(--dim);font-size:13px;line-height:1.8}
/* ---------- 微信对话页 ---------- */
#screen-chat{background:#111116}
.chat-bg{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 0%,#1a1a24 0%,#111116 60%);pointer-events:none}
.chat-body{position:relative;flex:1;overflow-y:auto;padding:12px 10px 16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chat-body::-webkit-scrollbar{display:none}
.time-chip{text-align:center;margin:12px auto 4px;width:fit-content;padding:3px 10px;border-radius:5px;
  background:rgba(0,0,0,.28);color:var(--dim);font-size:10px}
.msg{display:flex;margin-top:12px;align-items:flex-start}
.msg-name{padding:0 4px 3px;font-size:10px;color:var(--dim);margin-top:12px}
.msg-name.me-name{text-align:right}
.msg .bubble{max-width:78%;padding:8px 11px;border-radius:10px;font-size:14px;line-height:1.5;
  word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.msg.me{justify-content:flex-end}
.msg.me .bubble{background:var(--green);color:#111;border-top-right-radius:3px}
.msg.peer .bubble{background:#26262e;color:var(--text);border-top-left-radius:3px}
/* 消息类型卡片 */
.card{max-width:78%;border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.voice{display:flex;align-items:center;gap:8px}
.voice .vf{font-size:15px}.voice .vt{font-size:12px;color:var(--sub)}
.voice .words{font-size:11px;color:var(--dim);margin-top:2px}
.img-card{width:180px;height:120px;background:linear-gradient(135deg,#2f3a5f,#1d2440);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;color:#8fa3d8}
.img-card .ic{font-size:22px}
.img-card .cap{font-size:10px;line-height:1.4;padding:0 10px;text-align:center;color:#b7c4e8}
.redpack{background:linear-gradient(160deg,#ff6a5e,#fa5151);color:#fff;padding:13px 15px;width:200px}
.redpack .rp-top{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.redpack .rp-top .coin{font-size:18px}
.redpack .rp-bless{font-size:11px;color:#ffd9d4;margin:7px 0 9px;line-height:1.5}
.redpack .rp-btn{display:inline-block;background:#f5c97b;color:#a14c00;font-size:12px;font-weight:700;
  padding:3px 14px;border-radius:999px}
.transfer{background:#26262e;padding:12px 14px;width:190px}
.transfer .t-title{font-size:11px;color:var(--sub);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.transfer .t-amt{font-size:20px;font-weight:700;color:var(--green);letter-spacing:.5px}
.transfer .t-note{font-size:11px;color:var(--sub);margin-top:5px}
.loc{background:#26262e;width:200px}
.loc .map{height:66px;background:repeating-linear-gradient(0deg,#1c1c24 0 1px,transparent 1px 14px),
  repeating-linear-gradient(90deg,#1c1c24 0 1px,transparent 1px 14px),#23232e;position:relative}
.loc .pin{position:absolute;top:50%;left:50%;transform:translate(-50%,-70%);font-size:18px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.loc .loc-body{padding:8px 11px}
.loc .loc-name{font-size:13px;font-weight:600}
.loc .loc-addr{font-size:10px;color:var(--sub);margin-top:2px;line-height:1.4}
.forward{background:#232330;border:1px solid var(--line);width:210px}
.forward .fw-title{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:9px 11px;border-bottom:1px solid var(--line)}
.forward .fw-lines{font-size:11px;color:var(--sub);padding:8px 11px;line-height:1.65;max-height:150px;overflow:hidden}
.sticker{width:150px;height:130px;border-radius:12px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;background:linear-gradient(135deg,#3f2d56,#24203a);border:1px solid #39304d}
.sticker .se{font-size:34px}
.sticker .sd{font-size:10px;color:#b9a9d6;padding:0 10px;text-align:center;line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <!-- 主屏 -->
  <div id="screen-home" class="screen on">
    <div class="home-top">
      <div class="home-date" id="homeDate"></div>
      <div class="home-time" id="homeTime"></div>
    </div>
    <div class="home-apps">
      <button class="app-tile" id="appProfile">
        <div class="icon icon-profile">📁</div><div class="label">档案</div>
      </button>
      <button class="app-tile" id="appWechat">
        <div class="icon icon-wechat">💬</div><div class="label">微信</div>
      </button>
    </div>
  </div>

  <!-- 档案页 -->
  <div id="screen-profile" class="screen">
    <div class="page-head">
      <button class="back" data-back="home">‹</button>
      <div class="title">档案</div>
    </div>
    <div class="page-body" id="profileBody"></div>
  </div>

  <!-- 微信会话列表 -->
  <div id="screen-chatlist" class="screen">
    <div class="page-head">
      <button class="back" data-back="home">‹</button>
      <div class="title">微信</div>
    </div>
    <div class="page-body" id="chatListBody"></div>
  </div>

  <!-- 微信对话页 -->
  <div id="screen-chat" class="screen">
    <div class="chat-bg"></div>
    <div class="page-head" style="position:relative">
      <button class="back" data-back="chatlist">‹</button>
      <div class="title" id="chatTitle">对话</div>
    </div>
    <div class="chat-body" id="chatBody"></div>
  </div>
</div>

<script>
'use strict';
/* ═══════════ 慕恩手机前端 v2.0 ═══════════
   纯前端渲染层：不解析标签、不读取 ST —— 数据由宿主（TH 脚本）解析后经 postMessage 推送。
   协议：
     host → iframe: {type:'muen:profile', stat: {...}|null}
                    {type:'muen:wechat', chats: [...]}
     iframe → host: {type:'muen:ready'}
*/
var state = { route:'home', stat:null, chats:[], chatId:null };

/* ---------- 工具 ---------- */
function $(sel){ return document.querySelector(sel); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* 成对值 [v, "条件"] 或裸值解包 */
function unwrap(v, d){
  if (v === undefined || v === null || v === '') return d;
  return Array.isArray(v) ? v[0] : v;
}
/* lodash 风格点路径取值（与卡内 EJS _.get 语义一致）+ 成对值解包 */
function pathGet(obj, p, d){
  try {
    var v = obj;
    var ks = String(p).split('.');
    for (var i = 0; i < ks.length; i++) { if (v == null) return d; v = v[ks[i]]; }
    if (v === undefined || v === null) return d;
    return Array.isArray(v) ? v[0] : v;
  } catch (e) { return d; }
}
/* ---------- 暴露度公式（与卡内 EJS 投影一致：唯一规范） ---------- */
/* 七件套分级权重：缺失 胸罩/内裤20 上装/下装12 外衣8 丝袜4 鞋0；半褪=缺失一半 */
/* CLOTH7 顺序即档案页显示顺序：从上往下（上身外→内，再下身、腿、脚） */
var CLOTH7 = ['外衣','上装','胸罩','下装','内裤','丝袜','鞋'];
var MISS_W = { '外衣':8, '上装':12, '下装':12, '胸罩':20, '内裤':20, '丝袜':4, '鞋':0 };
var HALF_W = { '外衣':4, '上装':6, '下装':6, '胸罩':10, '内裤':10, '丝袜':2, '鞋':0 };
function computeExposure(stat){
  var privacy = pathGet(stat, '世界.私密性', '公开');
  var activity = pathGet(stat, '世界.活动', '日常');
  var slot = function(k){ return pathGet(stat, '角色.衣着.'+k+'.状态', '完好'); };
  var missing = 0, halfScore = 0, removedN = 0, halfN = 0;
  CLOTH7.forEach(function(k){
    var s = slot(k);
    if (['脱下','破损'].indexOf(s) >= 0){ missing += MISS_W[k]; removedN++; }
    else if (s === '半褪'){ halfScore += HALF_W[k]; halfN++; }
  });
  var base = privacy==='室内'?5 : privacy==='半公开'?20 : privacy==='野外'?30 : 40;
  var exposure = Math.min(100, base + missing + halfScore);
  var isNSFW = ['性爱','调教'].indexOf(activity) >= 0;
  return { exposure:exposure, privacy:privacy, removed:removedN, half:halfN, missing:missing, halfScore:halfScore, isNSFW:isNSFW };
}
function num(v, d){
  var n = Number(unwrap(v, d));
  return Number.isFinite(n) ? n : d;
}
/* ---------- 主屏时钟 ---------- */
var WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function tickClock(){
  var n = new Date();
  var hh = String(n.getHours()).padStart(2,'0');
  var mm = String(n.getMinutes()).padStart(2,'0');
  var t = $('#homeTime'); if (t) t.textContent = hh + ':' + mm;
  var dt = $('#homeDate');
  if (dt) dt.textContent = n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 · '+WEEK[n.getDay()];
}
setInterval(tickClock, 1000); tickClock();

/* ---------- 路由 ---------- */
function go(route, chatId){
  ['home','profile','chatlist','chat'].forEach(function(r){
    var el = $('#screen-'+r);
    if (el) el.classList.toggle('on', r === route);
  });
  state.route = route;
  if (route === 'chat') { state.chatId = chatId; renderChat(); }
  if (route === 'chatlist') renderChatList();
  if (route === 'profile') renderProfile();
}
document.addEventListener('click', function(e){
  var b = e.target.closest('.back');
  if (b) { go(b.dataset.back); return; }
  var it = e.target.closest('.chat-item');
  if (it) { go('chat', it.dataset.chat); return; }
  if (e.target.closest('#appProfile')) { go('profile'); return; }
  if (e.target.closest('#appWechat')) { go('chatlist'); return; }
});

/* ---------- 档案页 ---------- */
function badge(text, cls){ return '<span class="badge '+(cls||'badge-gray')+'">'+esc(text)+'</span>'; }
function renderProfile(){
  var body = $('#profileBody');
  var st = state.stat;
  if (!st){ body.innerHTML = '<div class="empty-tip">暂无档案数据<br>（开始对话后自动显示）</div>'; return; }
  var cal = pathGet(st, '世界.日历', {});
  var aff = num(pathGet(st, '角色.好感度'), 0);
  var dep = num(pathGet(st, '角色.堕落度'), 0);
  var des = num(pathGet(st, '角色.欲望'), 0);
  var privacy = pathGet(st, '世界.私密性', '公开');
  var activity = pathGet(st, '世界.活动', '日常');
  var exp = computeExposure(st);
  var ex = [];

  /* ── 世界：自然时间 + 胶囊 + 地点 ── */
  var WEEK_CN = ['', '星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
  var wk = pathGet(cal, '星期', null);
  if (/^\d+$/.test(String(wk))) wk = WEEK_CN[Number(wk)] || wk;
  var season = pathGet(cal, '季节', null);
  var moment = pathGet(cal, '时刻', null);
  var timeParts = [wk, season, moment].filter(Boolean);
  ex.push('<div class="section"><div class="section-title"><span class="dot"></span>世界</div>');
  ex.push('<div class="world-line">' + esc(timeParts.join(' · ')) + '</div>');
  ex.push('<div class="capsule-row">' +
    '<span class="capsule ' + (privacy==='公开'?'cap-pub':privacy==='野外'?'cap-pub':privacy==='半公开'?'cap-priv':'cap-indoor') + '">' + esc(privacy) + '</span>' +
    '<span class="capsule ' + (exp.isNSFW?'cap-nsfw':activity==='日常'?'cap-normal':'cap-other') + '">' + esc(activity) + '</span>' +
    '</div>');
  ex.push('<div class="row"><span class="k">地点</span><span class="v">' + esc(pathGet(st,'世界.地点','？')) + '</span></div>');
  ex.push('</div>');

  /* ── 状态：数值卡（无进度条） ── */
  ex.push('<div class="section"><div class="section-title"><span class="dot"></span>状态</div>');
  ex.push('<div class="stat-grid">' +
    '<div class="stat-cell"><span class="sc-label">好感度</span><span class="sc-val sc-aff">' + aff + '</span></div>' +
    '<div class="stat-cell"><span class="sc-label">堕落度</span><span class="sc-val sc-dep">' + dep + '</span></div>' +
    '<div class="stat-cell"><span class="sc-label">欲望</span><span class="sc-val sc-des">' + des + '</span></div>' +
    '<div class="stat-cell"><span class="sc-label">暴露</span><span class="sc-val sc-exp">' + exp.exposure + '<span class="sc-unit">/100</span></span>' +
    '<span class="sc-sub">' + badge(exp.isNSFW?'NSFW':'日常', exp.isNSFW?'badge-purple':'badge-green') +
    badge('缺失'+exp.removed+' · 半褪'+exp.half, 'badge-gray') + '</span></div>' +
    '</div>');
  ex.push('</div>');

  /* ── 衣着：只显示实际穿着的；按身体部位排序（上半身组 → 下半身组 → 脚） ──
     外衣字段按物品归类：裙装→下半身组，外套类→上半身组 */
  var worn = CLOTH7.filter(function(k){
    return pathGet(st, '角色.衣着.'+k+'.物品', '未穿') !== '未穿';
  }).map(function(k){
    var item = pathGet(st, '角色.衣着.'+k+'.物品', '未穿');
    var stt = pathGet(st, '角色.衣着.'+k+'.状态', '完好');
    var cls = stt==='完好'?'badge-green':(stt==='半褪'?'badge-amber':(stt==='脱下'||stt==='破损'||stt==='脱除')?'badge-red':'badge-blue');
    var label = k;
    if (k === '外衣') {
      if (/裙/.test(item)) label = '裙装';
      else if (/外套|大衣|风衣|夹克/.test(item)) label = '外套';
    } else if (k === '下装') {
      if (/裤/.test(item)) label = '裤子';
      else if (/裙/.test(item)) label = '裙子';
    }
    // 排序权重：上半身 10/20/30 → 下半身 70/80/90 → 鞋 100
    var rank = { '鞋':100, '丝袜':90, '内裤':80, '下装':70, '胸罩':20, '上装':10 }[k];
    if (rank === undefined) rank = /裙/.test(item) ? 70 : 30; // 外衣：裙装→下半身，外套→上半身
    return { k:k, label:label, item:item, stt:stt, cls:cls, rank:rank };
  }).sort(function(a, b){ return a.rank - b.rank; });
  ex.push('<div class="section"><div class="section-title"><span class="dot"></span>衣着</div>');
  if (worn.length) {
    worn.forEach(function(c){
      ex.push('<div class="row"><span class="k">'+esc(c.label)+'</span><span class="v">'+esc(c.item)+' '+badge(c.stt, c.cls)+'</span></div>');
    });
  } else {
    ex.push('<div class="text-line empty">无衣物</div>');
  }
  ex.push('</div>');

  /* ── 身体状态：痕迹 + 改造列表 ── */
  var trace = pathGet(st, '角色.痕迹', '');
  var mod = pathGet(st, '角色.改造', '');
  ex.push('<div class="section"><div class="section-title"><span class="dot"></span>身体状态</div>');
  ex.push(trace ? '<div class="text-line"><span style="color:var(--sub)">痕迹</span> '+esc(trace)+'</div>'
                : '<div class="text-line empty">痕迹：无</div>');
  var mods = String(mod || '').split(/[\n;；、]/).map(function(s){ return s.trim(); }).filter(Boolean);
  if (mods.length) {
    mods.forEach(function(md){
      ex.push('<div class="mod-item"><span class="dot">●</span><span>'+esc(md)+'</span></div>');
    });
  } else {
    ex.push('<div class="text-line empty">改造：无</div>');
  }
  ex.push('</div>');

  /* ── 部位：熟练/开发（保留进度条） ── */
  var PARTS = ['手','嘴','穴','尻','尿','胸'];
  ex.push('<div class="section"><div class="section-title"><span class="dot"></span>部位</div>');
  ex.push('<div class="parts-grid">');
  PARTS.forEach(function(p){
    var sk = num(pathGet(st, '部位.'+p+'.熟练度'), 0);
    var dv = num(pathGet(st, '部位.'+p+'.开发度'), 0);
    ex.push('<div class="part"><div class="pn">'+p+'</div>'+
      '<div class="pr"><span>熟练 '+sk+'</span></div><div class="bar"><i class="b-skill" style="width:'+sk+'%"></i></div>'+
      '<div class="pr"><span>开发 '+dv+'</span></div><div class="bar"><i class="b-dev" style="width:'+dv+'%"></i></div></div>');
  });
  ex.push('</div></div>');
  body.innerHTML = ex.join('');
}

/* ---------- 微信：会话列表 ---------- */
function previewText(m){
  switch(m.type){
    case 'text': return m.text;
    case 'voice': return '[语音] '+m.seconds+'″';
    case 'image': return '[图片]';
    case 'video': return '[视频] '+m.duration;
    case 'redpack': return '[红包] '+m.bless;
    case 'transfer': return '[转账] ¥'+m.amount;
    case 'location': return '[位置] '+m.place;
    case 'forward': return '[转发] '+m.title;
    case 'sticker': return '[表情]';
    default: return '';
  }
}
function renderChatList(){
  var body = $('#chatListBody');
  var chats = state.chats || [];
  if (!chats.length){
    body.innerHTML = '<div class="empty-tip">暂无微信消息<br>当剧情出现微信对话时，<br>AI 输出的 &lt;wechat&gt; 内容会显示在这里</div>';
    return;
  }
  var html = '';
  chats.forEach(function(c){
    var last = c.messages[c.messages.length-1];
    var time = '';
    for (var i=c.messages.length-1;i>=0;i--){ if(c.messages[i].type==='time'){ time=c.messages[i].time; break; } }
    html += '<div class="chat-item" data-chat="'+esc(c.id)+'">'+
      '<div class="chat-ava">'+(c.peer ? esc(c.peer.slice(0,1)) : '💬')+'</div>'+
      '<div class="chat-main"><div class="chat-top"><span class="chat-name">'+esc(c.remark || c.peer)+'</span>'+
      '<span class="chat-time">'+esc(time)+'</span></div>'+
      '<div class="chat-preview">'+esc(previewText(last))+'</div></div></div>';
  });
  body.innerHTML = html;
}
/* ---------- 微信：消息渲染 ---------- */
function msgBubble(m){
  var me = m.side === 'me';
  var cls = me ? 'msg me' : 'msg peer';
  var html = '<div class="'+cls+'">';
  switch(m.type){
    case 'text':
      html += '<div class="bubble">'+esc(m.text)+'</div>'; break;
    case 'voice':
      html += '<div class="bubble voice"><span class="vf">🔊</span><span class="vt">'+esc(m.seconds)+'″</span>'+
        '<span class="words">'+esc(m.text)+'</span></div>'; break;
    case 'image':
      html += '<div class="card img-card"><div class="ic">🖼️</div><div class="cap">'+esc(m.desc)+'</div></div>'; break;
    case 'video':
      html += '<div class="card img-card"><div class="ic">▶️</div><div class="cap">时长 '+esc(m.duration)+'<br>'+esc(m.desc)+'</div></div>'; break;
    case 'redpack':
      html += '<div class="card redpack"><div class="rp-top"><span class="coin">🧧</span>恭喜发财，大吉大利</div>'+
        '<div class="rp-bless">'+esc(m.bless)+'</div><span class="rp-btn">开</span></div>'; break;
    case 'transfer':
      html += '<div class="card transfer"><div class="t-title">💵 转账</div><div class="t-amt">¥'+esc(m.amount)+'</div>'+
        (m.note?'<div class="t-note">'+esc(m.note)+'</div>':'')+'</div>'; break;
    case 'location':
      html += '<div class="card loc"><div class="map"><span class="pin">📍</span></div>'+
        '<div class="loc-body"><div class="loc-name">'+esc(m.place)+'</div><div class="loc-addr">'+esc(m.addr)+'</div></div></div>'; break;
    case 'forward':
      html += '<div class="card forward"><div class="fw-title">📄 '+esc(m.title)+'</div>'+
        '<div class="fw-lines">'+(m.lines||[]).map(esc).join('<br>')+'</div></div>'; break;
    case 'sticker':
      html += '<div class="sticker"><span class="se">😄</span><span class="sd">'+esc(m.desc)+'</span></div>'; break;
    default:
      html += '<div class="bubble">'+esc(m.text||'')+'</div>';
  }
  return html + '</div>';
}
function renderChat(){
  var c = (state.chats||[]).find(function(x){ return x.id === state.chatId; });
  $('#chatTitle').textContent = c ? (c.remark || c.peer) : '对话';
  var body = $('#chatBody');
  if (!c){ body.innerHTML = '<div class="empty-tip">对话不存在</div>'; return; }
  // 昵称展示：{{user}}/<user> 字面量显示为「我」
  function displayName(sender){
    var s = String(sender || '');
    var t = s.toLowerCase();
    if (t === '{{user}}' || t === '<user>' || t === 'user') return '我';
    return s;
  }
  var html = '';
  var prevSender = null;
  c.messages.forEach(function(m){
    if (m.type === 'time'){ html += '<div class="time-chip">'+esc(m.time)+'</div>'; prevSender = null; return; }
    // 无头像：双方消息组首都显示昵称（连续同发送者只显示一次），我方昵称右对齐
    if (m.sender && prevSender !== m.sender) {
      html += '<div class="msg-name' + (m.side === 'me' ? ' me-name' : '') + '">' + esc(displayName(m.sender)) + '</div>';
    }
    html += msgBubble(m);
    prevSender = m.sender;
  });
  body.innerHTML = html;
  body.scrollTop = body.scrollHeight;
}

/* ---------- 数据入口 ---------- */
window.addEventListener('message', function(e){
  var d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'muen:profile'){
    state.stat = d.stat || null;
    if (state.route === 'profile') renderProfile();
  } else if (d.type === 'muen:wechat'){
    state.chats = d.chats || [];
    if (state.route === 'chatlist') renderChatList();
    if (state.route === 'chat') renderChat();
  }
});
/* 就绪通知 */
try { window.parent.postMessage({type:'muen:ready'}, '*'); } catch(e){}
</script>
</body>
